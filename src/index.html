<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mt-4">
      <h1>Todos</h1>
      <a href="create.html" class="btn">Create product</a>
    </div>

    <form id="todo-form" class="row g-3 flex justify-content-end">
      <div class="col-md-3">
        <input type="text" class="form-control" id="search" placeholder="Search" name="search">
      </div>
      <div class="col-md-2">
        <select id="inputState" class="form-select" id="sort" name="sort">
          <option>Sort</option>
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </div>
    </form>

    <div id="todos"></div>

  </div>
  <script src="js/main.js"></script>
</body>
</html>
